[package]
name = "frame3d-solver"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Linear-elastic 3D space-frame solver for Beam Calculator Studio."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
